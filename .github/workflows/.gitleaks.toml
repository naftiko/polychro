title = "Custom Gitleaks config"

[extend]
useDefault = true

# NOTE on ordering: quality-gate.yml's `security-scan` job runs Trivy BEFORE
# Gitleaks on purpose. Trivy leaves behind .cache/trivy/ (its vulnerability DB)
# and trivy-report.json (its own scan report), both scanned by Gitleaks'
# `dir .` right after. Their binary/metadata content (DB blobs, the current
# commit SHA) can match Gitleaks' heuristic rules — false positives, not real
# secrets. That's why they're allowlisted below. If the step order changes, a
# new Trivy output path is added, or another tool is inserted before Gitleaks,
# re-check this allowlist (history: #150).
[[allowlists]]
description = "Ignore heavy/generated directories and CI-generated scan report artifacts (they contain tool/commit metadata, not repo content). '/target/' (not anchored to '^') also catches per-module target dirs (modules/*/target/) in this multi-module reactor."
paths = [
  "/target/",
  "^sonar-report/",
  "^node_modules/",
  "^.git/",
  "^.cache/",
  "^trivy-.*\\.json$",
  "^gitleaks-report\\.json$"
]

[[allowlists]]
description = "Repo convention: values explicitly marked as fake/dummy/placeholder are not real secrets"
regexes = [
  '''(?i)fake''',
  '''(?i)dummy''',
  '''(?i)placeholder''',
]

# security-violations.yml is a deliberately malicious fixture (SecurityRulesetTest)
# used to exercise the built-in security ruleset's own secret-detection rule —
# the "leaked token" is fixture data, not a real credential.
[[rules]]
id = "generic-api-key"
  [[rules.allowlists]]
  paths = [
    '''modules/polychro-rulesets/src/test/resources/fixtures/security-violations\.yml''',
  ]

# SonarQube local scanner default admin:admin credentials, used only against
# localhost during the quality gate bootstrap - not a real credential.
[[rules]]
id = "curl-auth-user"
  [[rules.allowlists]]
  regexes = [ '''^admin:admin$''' ]