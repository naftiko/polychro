name: Publish CLI Packages

# Builds the Polychro CLI as a jar plus a custom jlink JRE, one archive per OS with a SHA-256
# checksum, and installs it with scripts/install.sh / install.ps1 (issue #170). JReleaser makes
# the archives (jreleaser.yml). No executable of ours to sign, so Windows and macOS do not warn.
# On a v* tag, publish-cli-bin.yml calls it through workflow_call and JReleaser publishes the
# archives on the release.

on:
  pull_request:
    paths:
      - 'pom.xml'
      - 'modules/polychro-*/pom.xml'
      # Any module, not only polychro-cli: jdeps reads the final jar and all of lib/, so a module
      # that starts using a new JDK API can need a new module in the jlink runtime.
      - 'modules/*/src/main/**'
      - 'jreleaser.yml'
      - 'scripts/install.sh'
      - 'scripts/install.ps1'
      - 'modules/polychro-node/src/**'
      - 'modules/polychro-go/*.go'
      - 'modules/polychro-python/src/**'
      - '.github/workflows/publish-cli-packages.yml'
      - '.github/actions/scan-dependencies/**'
  workflow_dispatch:
  workflow_call:

jobs:
  # The package ships every runtime jar in lib/, so they are scanned before anything is built.
  # -Pjre-package makes the SBOM hold exactly what lands in lib/ (the profile adds slf4j-simple).
  scan-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      # Named for this workflow, so another scan in the same run can't clash with its upload.
      - uses: ./.github/actions/scan-dependencies
        with:
          maven-args: -Pjre-package -pl modules/polychro-cli -am
          report-name: trivy-package-report
          title: Trivy Dependency Scan (jar + JRE package)
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-package:
    name: Build package on ${{ matrix.os }}
    needs: scan-dependencies
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        include:
          # jdk: the variable jreleaser.yml reads this runner's JDK from.
          - os: macos-latest
            artifact_name: polychro-cli-macos-arm64.tar.gz
            jdk: POLYCHRO_JDK_MACOS_ARM64
          - os: ubuntu-latest
            artifact_name: polychro-cli-linux-amd64.tar.gz
            jdk: POLYCHRO_JDK_LINUX_X64
          - os: ubuntu-24.04-arm
            artifact_name: polychro-cli-linux-arm64.tar.gz
            jdk: POLYCHRO_JDK_LINUX_ARM64
          - os: windows-latest
            artifact_name: polychro-cli-windows-amd64.zip
            jdk: POLYCHRO_JDK_WINDOWS_X64

    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          # The latest 25.x build, not the runner's cached one: the JDK we ship gets its security fixes.
          check-latest: true
          distribution: 'temurin'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # -Pjre-package writes target/polychro.jar (its manifest lists the other jars by name) and
      # copies every runtime dependency into target/lib. Not a shaded jar: see modules/polychro-cli/pom.xml.
      - name: Build polychro.jar and lib/ with Maven
        run: |
          mvn -B clean package -Pjre-package -pl modules/polychro-cli -am -DskipTests
          # Without -q, so a failure says why; the version goes to a file, not into the log.
          mvn -B help:evaluate -Dexpression=project.version -Doutput=target/version.txt
          {
            echo "JRELEASER_PROJECT_VERSION=$(cat target/version.txt)"
            echo "${{ matrix.jdk }}=$JAVA_HOME"
          } >> "$GITHUB_ENV"
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # JReleaser builds the jlink runtime and packs it with the jars (jreleaser.yml): jdeps picks
      # the JDK modules, --generate-cds-archive writes the JDK's class cache that the installer's
      # per-install cache builds on. Each runner builds its own OS's package with its own JDK.
      - name: Package with JReleaser
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          version: 1.26.0
          arguments: assemble --select-current-platform
          # jlink must use the JDK set up above, not the action's own.
          setup-java: false

      # The installers run bin/java -jar jars/polychro.jar from the package's one folder: fail
      # fast if that layout ever drifts, before the test job installs it.
      - name: Smoke test the package — extract + run --version
        run: |
          set -euo pipefail
          PACKAGE="out/jreleaser/assemble/polychro-cli/jlink/${{ matrix.artifact_name }}"
          TESTDIR="$RUNNER_TEMP/polychro-package-smoketest"
          mkdir -p "$TESTDIR"
          case "$PACKAGE" in
            *.zip) pwsh -NoProfile -Command "Expand-Archive -Path '$PACKAGE' -DestinationPath '$TESTDIR'"; JAVA=java.exe ;;
            *) tar xzf "$PACKAGE" -C "$TESTDIR"; JAVA=java ;;
          esac
          ROOT="$TESTDIR/${{ matrix.artifact_name }}"
          ROOT="${ROOT%.tar.gz}"; ROOT="${ROOT%.zip}"
          ls "$ROOT"
          # lib/server on macOS and Linux, bin\server on Windows.
          [ -f "$ROOT/lib/server/classes.jsa" ] || [ -f "$ROOT/bin/server/classes.jsa" ] \
            || { echo "FAIL: jlink did not write the JDK's class cache"; exit 1; }
          "$ROOT/bin/$JAVA" -jar "$ROOT/jars/polychro.jar" --version

      # The hash alone, as JReleaser writes it on the release (checksum.individual in jreleaser.yml).
      - name: Generate checksum
        working-directory: out/jreleaser/assemble/polychro-cli/jlink
        run: |
          set -euo pipefail
          if command -v sha256sum >/dev/null; then SUM="sha256sum"; else SUM="shasum -a 256"; fi
          $SUM "${{ matrix.artifact_name }}" | awk '{ printf "%s", $1 }' > "${{ matrix.artifact_name }}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            out/jreleaser/assemble/polychro-cli/jlink/${{ matrix.artifact_name }}
            out/jreleaser/assemble/polychro-cli/jlink/${{ matrix.artifact_name }}.sha256

      - name: Keep JReleaser's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-log-${{ matrix.jdk }}
          path: out/jreleaser/trace.log
          retention-days: 7

  test-package:
    name: Test package on ${{ matrix.os }}
    needs: build-package
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: polychro-cli-macos-arm64.tar.gz
          - os: ubuntu-latest
            artifact_name: polychro-cli-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            artifact_name: polychro-cli-linux-arm64.tar.gz
          - os: windows-latest
            artifact_name: polychro-cli-windows-amd64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact_name }}
          path: ./pkg

      # The .sha256 holds the hash alone, as on the release.
      - name: Verify checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        working-directory: ./pkg
        run: |
          expected=$(cat "${{ matrix.artifact_name }}.sha256")
          actual=$(shasum -a 256 "${{ matrix.artifact_name }}" | awk '{ print $1 }')
          [ "$actual" = "$expected" ] || { echo "Checksum mismatch: expected $expected, got $actual"; exit 1; }

      - name: Verify checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $expected = (Get-Content "./pkg/${{ matrix.artifact_name }}.sha256" -Raw).Split(' ')[0].Trim().ToLower()
          $actual = (Get-FileHash "./pkg/${{ matrix.artifact_name }}" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "Checksum mismatch: expected $expected, got $actual"
          }

      - name: Install via install.sh (real script, mock release endpoint) (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8931 --directory ./pkg --bind 127.0.0.1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 20); do
            curl -fsS "http://127.0.0.1:8931/${{ matrix.artifact_name }}.sha256" >/dev/null 2>&1 && break
            sleep 0.5
          done

          # A space in the install root, so quoting is exercised for real.
          POLYCHRO_HOME="$RUNNER_TEMP/polychro home" \
          POLYCHRO_NO_MODIFY_RC=1 \
          POLYCHRO_VERSION="v0.0.0-local-ci" \
          POLYCHRO_BASE_URL="http://127.0.0.1:8931" \
            sh scripts/install.sh
          # Only bin goes on PATH, like the rc file line. POLYCHRO_HOME is not exported, so the
          # next steps run the wrapper as a new shell would.
          echo "$RUNNER_TEMP/polychro home/bin" >> "$GITHUB_PATH"

      - name: Install via install.ps1 (real script, mock release endpoint) (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkgDir = Join-Path (Get-Location) "pkg"
          $proc = Start-Process -FilePath "python" -ArgumentList "-m","http.server","8931","--directory","$pkgDir","--bind","127.0.0.1" -PassThru -NoNewWindow
          try {
            for ($i = 0; $i -lt 20; $i++) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8931/${{ matrix.artifact_name }}.sha256" | Out-Null
                break
              } catch { Start-Sleep -Milliseconds 500 }
            }

            # A space and a non-ASCII character in the install root: cmd.exe reads polychro.cmd
            # in the OEM code page, so this catches a wrapper that would garble such a path.
            $env:POLYCHRO_HOME = "$env:RUNNER_TEMP\polychro h$([char]0x00F4)me"
            $env:POLYCHRO_NO_MODIFY_PATH = "1"
            $env:POLYCHRO_VERSION = "v0.0.0-local-ci"
            $env:POLYCHRO_BASE_URL = "http://127.0.0.1:8931"
            & .\scripts\install.ps1

            # Only bin goes on PATH. POLYCHRO_HOME is not exported, so the next steps check that
            # polychro.cmd finds its install root by itself.
            Add-Content -Path $env:GITHUB_PATH -Value "$env:POLYCHRO_HOME\bin"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      # Git Bash does not resolve a .cmd file from a bare name, so the bash steps below call
      # the wrapper through $POLYCHRO.
      - name: CLI is on PATH
        shell: bash
        run: |
          POLYCHRO=polychro
          [ "$RUNNER_OS" = "Windows" ] && POLYCHRO=polychro.cmd
          echo "POLYCHRO=$POLYCHRO" >> "$GITHUB_ENV"
          command -v "$POLYCHRO"
          "$POLYCHRO" --version
          "$POLYCHRO" --help
          "$POLYCHRO" lint --help

      # The installer's warm-up lint must leave a class cache, and later runs must map it:
      # without it every lint is several times slower (base CDS missing, or the cache not written).
      - name: Start-up cache — created at install and used
        shell: bash
        run: |
          set -euo pipefail
          CACHE="$(dirname "$(command -v "$POLYCHRO")")/../current/polychro.jsa"
          ls -l "$CACHE"
          test -s "$CACHE"
          # The launcher silences CDS logging, so look at where classes come from instead:
          # "shared objects file (top)" is the cache written at install time.
          OUT=$(JAVA_TOOL_OPTIONS="-Xlog:class+load=info" "$POLYCHRO" --version 2>&1)
          FROM_CACHE=$(echo "$OUT" | grep -c "shared objects file (top)" || true)
          echo "Classes loaded from the install cache: $FROM_CACHE"
          if [ "$FROM_CACHE" -lt 100 ]; then
            echo "FAIL: the class cache exists but the JVM did not use it"; exit 1
          fi

      # Lint regression guards, plus three that only the jlink runtime can break:
      # a JavaScript ruleset function (GraalJS on a regular JDK), an outbound HTTPS $ref
      # (crypto modules) and `serve` (HTTP server). Each also fails on a missing class or
      # module, the symptom of a jlink image that dropped one.
      - name: Package regression — lint checks
        shell: bash
        run: |
          set -u
          FAIL=0
          WORK="$RUNNER_TEMP/polychro-regression"
          mkdir -p "$WORK"
          check() {  # check <name> <expected exit> <expected text> <polychro args...>
            local name=$1 want=$2 text=$3; shift 3
            local out status
            # Lint exits 1 or 2 on findings: keep -e (set by the runner) from ending the step.
            out=$("$POLYCHRO" "$@" 2>&1) && status=0 || status=$?
            echo "----- $name (exit $status) -----"; echo "$out"
            if echo "$out" | grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError|SSLHandshakeException|NoSuchAlgorithmException|ExceptionInInitializerError"; then
              echo "FAIL: $name — missing class or module in the jlink image"; FAIL=1
            elif [ "$status" -ne "$want" ] || ! echo "$out" | grep -q -- "$text"; then
              echo "FAIL: $name — expected exit $want and '$text'"; FAIL=1
            fi
          }
          retry() {  # retry <attempts> <check args...>: a failure counts only if every attempt fails
            local attempts=$1 i saved=$FAIL; shift
            for ((i = 1; i <= attempts; i++)); do
              FAIL=0
              check "$@"
              if [ "$FAIL" -eq 0 ]; then FAIL=$saved; return; fi
              if [ "$i" -lt "$attempts" ]; then echo "Attempt $i of $attempts failed, retrying in 10 s"; sleep 10; fi
            done
            FAIL=1
          }

          cd "$WORK"
          echo '{"type":"object","required":["missing"]}' > schema.json
          echo 'foo: bar' > sample.yaml
          check "JSON Schema lint" 2 "missing" lint sample.yaml -s schema.json

          printf '# Title\n\nSome paragraph.\n' > doc.md
          printf 'rules:\n  first-block-must-be-paragraph:\n    message: "First block must be a paragraph"\n    severity: error\n    given: "$.document.blocks[0]"\n    then:\n      field: "type"\n      function: pattern\n      functionOptions:\n        match: "^paragraph$"\n' > markdown-ruleset.yml
          check "Markdown ruleset projection" 2 "First block must be a paragraph" lint doc.md -r markdown-ruleset.yml

          printf '<html><body><p>hi</p></body></html>\n' > doc.html
          printf 'rules:\n  first-node-must-be-body:\n    message: "First top-level node must be body"\n    severity: error\n    given: "$.document.nodes[0]"\n    then:\n      field: "tag"\n      function: pattern\n      functionOptions:\n        match: "^body$"\n' > html-ruleset.yml
          check "HTML ruleset projection" 2 "First top-level node must be body" lint doc.html -r html-ruleset.yml

          # Network-dependent, so retried: only a lasting json.schemastore.org outage fails the job.
          # A real HTTPS call is what exercises jdk.crypto.ec, and a missing crypto module fails
          # every attempt with an SSL/algorithm exception, so the retry cannot hide it.
          printf '{"$schema":"https://json-schema.org/draft/2020-12/schema","$ref":"https://json.schemastore.org/github-action.json"}\n' > remote-schema.json
          printf 'name: x\n' > action.yml
          retry 3 "Remote \$ref over HTTPS" 2 "runs" lint action.yml -s remote-schema.json

          cd "$GITHUB_WORKSPACE/examples/tutorial/track-1-yaml"
          # Step 6 duplicates an operationId, so its only finding comes from the JavaScript function.
          check "JavaScript ruleset function" 2 "\[operation-id-unique\]" \
            lint step-6-openapi.yml -s openapi-schema.json -r openapi-ruleset.yml
          # The jar runs GraalJS without runtime compilation; PolychroCli turns the notice off,
          # and slf4j-simple only prints warnings and errors. A clean run prints no log line
          # ("WARN ClassName - ..."; a diagnostic reads "WARN [rule]: ..." or "ERROR at ...").
          OUT=$("$POLYCHRO" lint step-6-openapi.yml -s openapi-schema.json -r openapi-ruleset.yml 2>&1 || true)
          if echo "$OUT" | grep -iE "polyglot engine|slf4j" || echo "$OUT" | grep -E "^(WARN|ERROR) [A-Z][A-Za-z0-9]* - "; then
            echo "FAIL: start-up warnings leak into the output"; FAIL=1
          fi

          # A function that throws must still be reported on stderr, not dropped by the logger.
          mkdir -p "$WORK/broken-function/functions"
          cd "$WORK/broken-function"
          printf 'export default function (input) {\n  return input.nope.boom;\n}\n' > functions/broken.js
          printf 'functionsDir: functions\nfunctions: [broken]\nrules:\n  broken-rule:\n    message: "{{error}}"\n    severity: error\n    given: "$.name"\n    then:\n      function: broken\n' > broken-ruleset.yml
          printf 'name: x\n' > doc.yaml
          check "Failing JavaScript function is logged" 2 "WARN PolyglotRuleFunction" lint doc.yaml -r broken-ruleset.yml
          exit $FAIL

      - name: Package regression — serve answers MCP tools/list
        shell: bash
        run: |
          set -u
          "$POLYCHRO" serve > "$RUNNER_TEMP/serve.log" 2>&1 &
          SERVE_PID=$!
          LISTENING=0
          for i in $(seq 1 30); do
            curl -s -o /dev/null --max-time 2 http://127.0.0.1:3001/ && { LISTENING=1; break; }
            sleep 1
          done
          BODY=""
          if [ "$LISTENING" -eq 1 ]; then
            BODY=$(curl -s --max-time 15 -X POST http://127.0.0.1:3001/ \
              -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
              -H 'MCP-Protocol-Version: 2026-07-28' -H 'Mcp-Method: tools/list' \
              -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28"}}}' || true)
          fi
          kill "$SERVE_PID" 2>/dev/null || true
          echo "----- serve.log -----"; cat "$RUNNER_TEMP/serve.log"
          echo "----- tools/list -----"; echo "$BODY"
          if grep -E "NoClassDefFoundError|ClassNotFoundException|ServiceConfigurationError" "$RUNNER_TEMP/serve.log"; then
            echo "FAIL: jlink module-set regression on serve"; exit 1
          fi
          [ "$LISTENING" -eq 1 ] || { echo "FAIL: serve never listened on port 3001"; exit 1; }
          echo "$BODY" | grep -q '"name":"lint"' || { echo "FAIL: tools/list did not list the lint tool"; exit 1; }
          echo "PASS: serve answered tools/list"

      # `call` runs polychro.cmd in this cmd session, the way a user's terminal or another batch
      # file does: without setlocal, the POLYCHRO_HOME it sets would still be defined afterwards.
      # The lint exit code (2 on findings) must still reach the caller through the wrapper.
      - name: Wrapper — polychro.cmd leaves the caller's environment unchanged (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          set POLYCHRO_HOME=
          call polychro.cmd --version
          if errorlevel 1 exit /b 1
          if defined POLYCHRO_HOME (
            echo FAIL: polychro.cmd left POLYCHRO_HOME=%POLYCHRO_HOME% in the caller's session
            exit /b 1
          )
          echo foo: bar> "%RUNNER_TEMP%\wrapper-sample.yaml"
          echo {"type":"object","required":["missing"]}> "%RUNNER_TEMP%\wrapper-schema.json"
          call polychro.cmd lint "%RUNNER_TEMP%\wrapper-sample.yaml" -s "%RUNNER_TEMP%\wrapper-schema.json"
          set STATUS=%ERRORLEVEL%
          if not "%STATUS%"=="2" (
            echo FAIL: expected exit 2 from a lint with findings, got %STATUS%
            exit /b 1
          )
          echo PASS: no POLYCHRO_HOME leak, exit code passed through

      # The Python wrapper finds the binary on PATH (polychro.cmd on Windows) like a user's
      # machine would, without POLYCHRO_BIN.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Wrapper — the Python SDK runs the installed package
        shell: bash
        working-directory: examples/tutorial/track-1-yaml
        env:
          PYTHONPATH: ${{ github.workspace }}/modules/polychro-python/src
        run: |
          python - <<'EOF'
          from polychro.binary import resolve_binary
          from polychro.linter import Linter
          print("binary:", resolve_binary())
          result = Linter(schema="openapi-schema.json", ruleset="openapi-ruleset.yml").lint("step-3-openapi.yml")
          print("diagnostics:", len(result.diagnostics))
          assert len(result.diagnostics) == 1, result.diagnostics
          EOF

      # Same check for the Node and Go SDKs. On Windows the Node SDK cannot start polychro.cmd
      # (Node.js refuses batch files without a shell) and runs the bundled java.exe instead.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/polychro-node/package-lock.json

      - name: Wrapper — the Node SDK runs the installed package
        shell: bash
        run: |
          set -euo pipefail
          (cd modules/polychro-node && npm ci --no-audit --no-fund && npm run build)
          cd examples/tutorial/track-1-yaml
          node --input-type=module - <<'EOF'
          import { pathToFileURL } from "node:url";
          const sdk = pathToFileURL(`${process.env.GITHUB_WORKSPACE}/modules/polychro-node/dist/index.js`);
          const { lint } = await import(sdk.href);
          const result = await lint("step-3-openapi.yml", { schema: "openapi-schema.json", ruleset: "openapi-ruleset.yml" });
          console.log("diagnostics:", result.diagnostics.length);
          if (result.diagnostics.length !== 1) throw new Error(JSON.stringify(result.diagnostics));
          EOF

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: modules/polychro-go/go.mod
          cache: false

      - name: Wrapper — the Go SDK runs the installed package
        shell: bash
        run: |
          set -euo pipefail
          CHECK="$RUNNER_TEMP/go-sdk-check"
          mkdir -p "$CHECK"
          cat > "$CHECK/main.go" <<'EOF'
          package main

          import (
          	"fmt"
          	"os"

          	polychro "github.com/naftiko/polychro/polychro-go"
          )

          func main() {
          	bin, err := polychro.ResolveBinary()
          	fmt.Println("binary:", bin, err)
          	result, err := polychro.Lint("step-3-openapi.yml", polychro.Options{Schema: "openapi-schema.json", Ruleset: "openapi-ruleset.yml"})
          	if err != nil {
          		fmt.Println("error:", err)
          		os.Exit(1)
          	}
          	fmt.Println("diagnostics:", len(result.Diagnostics))
          	if len(result.Diagnostics) != 1 {
          		os.Exit(1)
          	}
          }
          EOF
          cd "$CHECK"
          go mod init go-sdk-check
          go mod edit -require=github.com/naftiko/polychro/polychro-go@v0.0.0 \
            -replace=github.com/naftiko/polychro/polychro-go="$GITHUB_WORKSPACE/modules/polychro-go"
          EXE=""
          [ "$RUNNER_OS" = "Windows" ] && EXE=".exe"
          go build -o "$CHECK/check$EXE" .
          cd "$GITHUB_WORKSPACE/examples/tutorial/track-1-yaml"
          "$CHECK/check$EXE"
