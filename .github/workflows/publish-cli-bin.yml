name: Publish CLI Binaries

# On a v* tag: builds and tests the CLI packages (a jar plus an embedded jlink JRE, one archive
# per OS, through publish-cli-packages.yml), then creates the release with them.

on:
  push:
    tags:
      - 'v*'  # Only trigger by new tags starting by "v" (v1.0.0, v2.1.3...). Because the build takes time.
  workflow_dispatch:
  workflow_call:

jobs:
  # The jar + JRE packages that scripts/install.sh and install.ps1 download, built, scanned and
  # tested by publish-cli-packages.yml.
  build-packages:
    name: Jar + JRE packages
    uses: ./.github/workflows/publish-cli-packages.yml
    permissions:
      contents: read
      packages: read

  # The one job that creates the release, once the packages are built and tested: a tag never
  # goes out with nothing for install.sh, which installs the newest release. JReleaser publishes
  # the four packages, the SBOM, a .sha256 per file and a changelog from the conventional commits
  # (jreleaser.yml). It refuses to start when one platform's package is missing.
  release:
    name: Create the release
    needs: [build-packages]
    if: startsWith(github.ref, 'refs/tags/')  # Not on a manual run, nor on the nightly's call.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      # The whole history: the changelog runs from the previous v* tag.
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Every artifact of this run named polychro-cli-*: the four packages, put where JReleaser
      # assembles them. JReleaser writes their .sha256 files again, the same way.
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: polychro-cli-*
          path: out/jreleaser/assemble/polychro-cli/jlink
          merge-multiple: true

      - name: Setup JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      # The CycloneDX SBOM of every module, made as publish-maven.yml makes the one it scans.
      # Made here, not attached by publish-maven.yml: JReleaser does not see a draft release, so a
      # draft opened for the SBOM would stay apart from the release (v1.0.0-beta9 has no SBOM).
      - name: Generate SBOM (CycloneDX)
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DoutputName=bom
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # A final release's changelog starts at the previous final release: its betas are left out.
      - name: Choose the version
        run: |
          {
            echo "JRELEASER_PROJECT_VERSION=${GITHUB_REF_NAME#v}"
            case "$GITHUB_REF_NAME" in
              *-*) echo "POLYCHRO_PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*' HEAD^ 2>/dev/null || true)" ;;
              *) echo "POLYCHRO_PREVIOUS_TAG=$(git describe --tags --abbrev=0 --match 'v*.*.*' --exclude '*-*' HEAD^ 2>/dev/null || true)" ;;
            esac
          } >> "$GITHUB_ENV"

      - name: Publish the release
        uses: jreleaser/release-action@97b5e2f0e845de2fe1dbbdf451ac6a21233fafff # v2
        with:
          version: 1.26.0
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep JReleaser's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-release-log
          path: out/jreleaser/trace.log
          retention-days: 7
