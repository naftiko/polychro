name: Publish CLI Binaries

on:
  push:
    tags:
      - 'v*'  # Only trigger by new tags starting by "v" (v1.0.0, v2.1.3...). Because the build takes time.
  workflow_dispatch:
  workflow_call:  

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Resolve dependencies
        # Populates the local .m2 repo so Trivy scans actual resolved transitive
        # versions (the classpath GraalVM will compile) rather than raw pom.xml.
        # Scoped to -pl modules/polychro-cli -am to match build-native's build scope
        run: mvn -B dependency:go-offline -pl modules/polychro-cli -am
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan pre-native dependency tree
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "json"
          output: "trivy-fs-results.json"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

      - name: Publish Trivy summary
        if: always()
        run: |
          echo "## Trivy Dependency Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f trivy-fs-results.json ]; then
            echo "> No report found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]?.Severity] | map(select(.=="CRITICAL")) | length' trivy-fs-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]?.Severity] | map(select(.=="HIGH")) | length' trivy-fs-results.json)

          [ "$CRITICAL" -gt 0 ] && STATUS="❌ ${CRITICAL} critical issue(s) — blocking publish" \
            || { [ "$HIGH" -gt 0 ] && STATUS="❌ ${HIGH} high issue(s) — blocking publish" || STATUS="✅ No critical or high issues"; }

          echo "**${STATUS}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| High     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-report
          path: trivy-fs-results.json

  build-native:
    name: Build on ${{ matrix.os }}
    needs: scan-dependencies
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux AMD64
          - os: ubuntu-latest
            artifact_name: polychro-cli-linux-amd64

          # Linux ARM64
          - os: ubuntu-24.04-arm
            artifact_name: polychro-cli-linux-arm64

          # macOS Apple Silicon (ARM64)
          - os: macos-latest  # macos-14+ uses Mx runners
            artifact_name: polychro-cli-macos-arm64

          # Windows AMD64
          - os: windows-latest
            artifact_name: polychro-cli-windows-amd64.exe

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Maven credentials for GitHub Packages
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build with Maven (Unix)
        if: runner.os != 'Windows'
        run: mvn -B clean package -Pnative -pl modules/polychro-cli -am -Dtest="io.polychro.cli.**" -Dsurefire.failIfNoSpecifiedTests=false
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with Maven (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: mvn -B clean package -Pnative -pl modules\polychro-cli -am "-Dtest=io.polychro.cli.**" "-Dsurefire.failIfNoSpecifiedTests=false"
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename artifact (Unix)
        if: runner.os != 'Windows'
        run: mv modules/polychro-cli/target/polychro-cli modules/polychro-cli/target/${{ matrix.artifact_name }}

      - name: Rename artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item modules\polychro-cli\target\polychro-cli.exe modules\polychro-cli\target\${{ matrix.artifact_name }}

      - name: Generate checksum (Unix)
        if: runner.os != 'Windows'
        working-directory: modules/polychro-cli/target
        run: sha256sum ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256

      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $hash = Get-FileHash modules\polychro-cli\target\${{ matrix.artifact_name }} -Algorithm SHA256
          "$($hash.Hash.ToLower())  ${{ matrix.artifact_name }}" | Out-File modules\polychro-cli\target\${{ matrix.artifact_name }}.sha256 -Encoding ASCII

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            modules/polychro-cli/target/${{ matrix.artifact_name }}
            modules/polychro-cli/target/${{ matrix.artifact_name }}.sha256

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')  # Only create release when a new tag is pushed (not when action is manually triggered).
        uses: softprops/action-gh-release@v1
        with:
          files: |
            modules/polychro-cli/target/${{ matrix.artifact_name }}
            modules/polychro-cli/target/${{ matrix.artifact_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test-binary:
    name: Smoke test on ${{ matrix.os }}
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: polychro-cli-linux-amd64
          - os: ubuntu-24.04-arm
            artifact_name: polychro-cli-linux-arm64
          - os: macos-latest
            artifact_name: polychro-cli-macos-arm64
          - os: windows-latest
            artifact_name: polychro-cli-windows-amd64.exe

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./bin

      - name: Make executable
        if: runner.os != 'Windows'
        run: chmod +x ./bin/${{ matrix.artifact_name }}

      - name: Smoke test version
        shell: bash
        run: |
          BIN="./bin/${{ matrix.artifact_name }}"

          OUT=$("$BIN" --version 2>&1 || true)
          echo "$OUT"

          echo "$OUT" | grep -E "polychro|[0-9]+\.[0-9]+"

          if echo "$OUT" | grep -E "MissingResourceException|ExceptionInInitializerError"; then
            echo "FAIL"
            exit 1
          fi

      - name: Smoke test CLI help
        shell: bash
        run: |
          BIN="./bin/${{ matrix.artifact_name }}"
          "$BIN" --help
          "$BIN" lint --help
          
      - name: Smoke test — JSON Schema lint (regression guard)
        shell: bash
        run: |
          BIN="./bin/${{ matrix.artifact_name }}"

          echo '{"type":"object","required":["missing"]}' > schema.json
          echo 'foo: bar' > sample.yaml

          STDERR=$("$BIN" lint sample.yaml -s schema.json 2>&1 || true)

          echo "$STDERR"

          if echo "$STDERR" | grep -E "MissingResourceException|ExceptionInInitializerError"; then
            echo "FAIL: native runtime regression"
            exit 1
          fi

      - name: Smoke test — Markdown ruleset projection (DocumentEnricher regression guard)
        shell: bash
        run: |
          BIN="./bin/${{ matrix.artifact_name }}"

          # polychro-markdown registers MarkdownDocumentEnricher via ServiceLoader so
          # Document.fromString can project markdown into $.document.blocks[*] (issue #36/#37).
          # GraalVM native-image does NOT auto-discover this SPI: it needs an explicit
          # reflect-config.json entry for the class and a resource-config.json pattern for
          # META-INF/services/io.polychro.spi.DocumentEnricher. If that registration regresses,
          # ServiceLoader silently returns no providers (no exception raised), the document
          # falls back to a raw TextNode, and the rule below would find zero matches instead
          # of firing — a false "no issues" pass that the exception-only checks above cannot
          # catch. This step proves the projected structure is actually there by asserting a
          # deliberate rule violation fires against it.
          printf '# Title\n\nSome paragraph.\n' > doc.md
          printf 'rules:\n  first-block-must-be-paragraph:\n    message: "First block must be a paragraph"\n    severity: error\n    given: "$.document.blocks[0]"\n    then:\n      field: "type"\n      function: pattern\n      functionOptions:\n        match: "^paragraph$"\n' > markdown-ruleset.yml

          set +e
          OUT=$("$BIN" lint doc.md -r markdown-ruleset.yml 2>&1)
          STATUS=$?
          set -e

          echo "$OUT"

          if [ "$STATUS" -ne 2 ] || ! echo "$OUT" | grep -q "First block must be a paragraph"; then
            echo "FAIL: markdown DocumentEnricher regression — expected a violation on projected \$.document.blocks[0], got exit=$STATUS"
            exit 1
          fi

      - name: Smoke test — HTML ruleset projection (DocumentEnricher regression guard)
        shell: bash
        run: |
          BIN="./bin/${{ matrix.artifact_name }}"

          # Same guard as above for polychro-html's HtmlDocumentEnricher, projecting into
          # $.document.nodes[*]. A full HTML document parses in "document" mode, so nodes[0]
          # is the <html> element itself — asserting it is NOT "body" deliberately fires.
          printf '<html><body><p>hi</p></body></html>\n' > doc.html
          printf 'rules:\n  first-node-must-be-body:\n    message: "First top-level node must be body"\n    severity: error\n    given: "$.document.nodes[0]"\n    then:\n      field: "tag"\n      function: pattern\n      functionOptions:\n        match: "^body$"\n' > html-ruleset.yml

          set +e
          OUT=$("$BIN" lint doc.html -r html-ruleset.yml 2>&1)
          STATUS=$?
          set -e

          echo "$OUT"

          if [ "$STATUS" -ne 2 ] || ! echo "$OUT" | grep -q "First top-level node must be body"; then
            echo "FAIL: html DocumentEnricher regression — expected a violation on projected \$.document.nodes[0], got exit=$STATUS"
            exit 1
          fi
