name: Publish CLI Binaries

# On a v* tag: builds and tests the CLI packages (a jar plus an embedded jlink JRE, one archive
# per OS, through publish-cli-packages.yml), then creates the release with them. The GraalVM
# native binaries are no longer built or released: the packages replace them for now.

on:
  push:
    tags:
      - 'v*'  # Only trigger by new tags starting by "v" (v1.0.0, v2.1.3...). Because the build takes time.
  workflow_dispatch:
  workflow_call:

jobs:
  # The jar + JRE packages that scripts/install.sh and install.ps1 download, built, scanned and
  # tested by publish-cli-packages.yml.
  build-packages:
    name: Jar + JRE packages
    uses: ./.github/workflows/publish-cli-packages.yml
    permissions:
      contents: read
      packages: read

  # The one job that creates the release, once the packages are built and tested: a tag never
  # goes out with nothing for install.sh, which installs the newest release.
  release:
    name: Create the release
    needs: [build-packages]
    if: startsWith(github.ref, 'refs/tags/')  # Not on a manual run, nor on the nightly's call.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Every artifact of this run named polychro-cli-*: the four packages, each with its .sha256.
      - name: Download the packages
        uses: actions/download-artifact@v8
        with:
          pattern: polychro-cli-*
          path: release
          merge-multiple: true

      # The names the install scripts ask for: fail here rather than ship a release on which one
      # platform's download returns a 404.
      - name: Check every file the release must carry
        shell: bash
        run: |
          set -euo pipefail
          ls -l release
          for f in polychro-cli-linux-amd64.tar.gz polychro-cli-linux-arm64.tar.gz \
                   polychro-cli-macos-arm64.tar.gz polychro-cli-windows-amd64.zip; do
            test -f "release/$f" || { echo "FAIL: $f is missing"; exit 1; }
            test -f "release/$f.sha256" || { echo "FAIL: $f.sha256 is missing"; exit 1; }
          done

      # The action creates the release as a draft, uploads every file, then publishes it, so the
      # release is never public with only part of its files. If publish-maven.yml has already
      # opened the release as a draft for its SBOM, the action reuses that draft.
      - name: Create the release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
