name: Quality Gate

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and verify
        # polychro-capability and polychro-cli require io.ikanos:ikanos-engine and
        # io.ikanos:ikanos-spec from GitHub Packages.
        # setup-java injects credentials via server-id: github-naftiko (matches pom.xml repo id).
        run: mvn -B clean verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  test-go:
    name: Test Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: modules/polychro-go/go.mod

      - name: Run tests
        working-directory: modules/polychro-go
        run: go test ./...

  test-node:
    name: Test Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/polychro-node/package-lock.json

      - name: Install dependencies
        working-directory: modules/polychro-node
        run: npm ci

      - name: Run tests
        working-directory: modules/polychro-node
        run: npm test

  test-python:
    name: Test Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        working-directory: modules/polychro-python
        run: pip install . pytest

      - name: Run tests
        working-directory: modules/polychro-python
        run: pytest

  security-scan:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest
    # Step order in this job matters: Trivy MUST run before Gitleaks.
    # Trivy writes its cache (.cache/trivy/) and its own reports (trivy-*.json)
    # into the workspace, and both contain hex-looking data (DB blobs, the
    # current commit SHA in report metadata) that Gitleaks' heuristic rules can
    # mistake for secrets. Running Gitleaks second is intentional so those paths
    # exist and can be allowlisted in .github/workflows/.gitleaks.toml (see the
    # entries for .cache/ and trivy-*.json) — swapping the order, or adding a
    # new Trivy/other-tool output file, without updating that allowlist will
    # reintroduce false positives (see #150).

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Init summary
        run: |
          echo "# Security Scan Report — $(date '+%Y-%m-%d %H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trivy | CVE vulnerabilities (CRITICAL/HIGH, unfixed ignored) — Java (SBOM), Go/Node/Python (fs), misconfig |" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | Secrets in the current working tree |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: Freeze Python dependencies
        # Trivy's fs scanner does not parse pyproject.toml's PEP 621
        # [project.dependencies] array — it needs a file named exactly
        # requirements.txt (confirmed locally: a same-content file named
        # requirements-frozen.txt is silently never picked up), poetry.lock,
        # or Pipfile.lock. polychro-python has none of those, so without this
        # step any dependency it declares would silently never be scanned.
        # The self-reference to the package being installed ("polychro @
        # file://...") is filtered out — it isn't a real dependency and Trivy
        # can't resolve a local file:// URL anyway (see naftiko/polychro#150).
        working-directory: modules/polychro-python
        run: |
          pip install .
          pip freeze | grep -v '^polychro' > requirements.txt

      - name: Resolve Java dependencies
        # Populates the local .m2 repo so the SBOM reflects actual resolved
        # transitive versions. Mirrors publish-maven.yml's scan-dependencies job.
        run: mvn -B dependency:go-offline
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        # Scans the SBOM (dependencies already resolved into ~/.m2 above)
        # instead of raw pom.xml files. Avoids Trivy's static pom.xml parser,
        # which for a *released* (non-SNAPSHOT) parent POM falls back to a live
        # Maven Central lookup and can hit a 429 rate-limit (naftiko/polychro#154).
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DoutputName=bom

      - name: Run Trivy scan (Java dependency vulnerabilities via SBOM)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'sbom'
          scan-ref: 'target/bom.json'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'json'
          output: 'trivy-vuln-report.json'
          exit-code: '0'

      - name: Run Trivy scan (Go/Node/Python dependency vulnerabilities)
        # scan-type fs would also try to parse pom.xml for Java, re-triggering
        # the #154 Maven Central lookup — skip-files excludes it since Java is
        # already covered by the SBOM scan above. Python is scanned via the
        # requirements.txt generated by the "Freeze Python dependencies" step
        # above (pyproject.toml's PEP 621 deps array is not parsed by Trivy).
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          skip-files: '**/pom.xml'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          format: 'json'
          output: 'trivy-other-vuln-report.json'
          exit-code: '0'

      - name: Run Trivy scan (misconfigurations)
        # skip-files avoids Trivy's static pom.xml parser here too (same
        # naftiko/polychro#154 rate-limit risk as the Go/Node vuln scan above)
        # — misconfig scanning doesn't need pom.xml, Java is covered by the
        # SBOM scan.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'misconfig'
          skip-files: '**/pom.xml'
          severity: 'CRITICAL,HIGH'
          format: 'json'
          output: 'trivy-misconfig-report.json'
          exit-code: '0'

      - name: Merge Trivy reports
        if: always()
        run: |
          for f in trivy-vuln-report.json trivy-other-vuln-report.json trivy-misconfig-report.json; do
            [ -f "$f" ] || echo '{"Results":[]}' > "$f"
          done
          jq -s '{Results: ([.[].Results // []] | add)}' \
            trivy-vuln-report.json trivy-other-vuln-report.json trivy-misconfig-report.json \
            > trivy-report.json

      - name: Publish Trivy summary
        id: trivy-summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Trivy Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f trivy-report.json ]; then
            echo "> No report found." >> $GITHUB_STEP_SUMMARY
            echo "trivy_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]?, .Results[]?.Misconfigurations[]? | select(.Severity=="CRITICAL")] | length' trivy-report.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]?, .Results[]?.Misconfigurations[]? | select(.Severity=="HIGH")] | length' trivy-report.json)

          [ "$CRITICAL" -gt 0 ] && STATUS="❌ ${CRITICAL} critical issue(s)" \
            || { [ "$HIGH" -gt 0 ] && STATUS="❌ ${HIGH} high issue(s)" || STATUS="✅ No critical or high issues"; }

          echo "**${STATUS}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| High     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Critical/High findings (vulnerabilities + misconfigurations, unfixed vulnerabilities ignored)</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Vulnerability ID | Severity | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------------------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")]
              | sort_by(if .Severity=="CRITICAL" then 0 else 1 end)
              | .[]
              | "| \(.PkgName) | \(.VulnerabilityID) | \(.Severity) | \(.InstalledVersion) | \(if (.FixedVersion // "") == "" then "n/a" else .FixedVersion end) |"
            ' trivy-report.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          echo "trivy_findings=$((CRITICAL + HIGH))" >> "$GITHUB_OUTPUT"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 14

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks-install
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -O /tmp/gitleaks-install/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks-install/gitleaks.tar.gz -C /tmp/gitleaks-install
          chmod +x /tmp/gitleaks-install/gitleaks
          sudo mv /tmp/gitleaks-install/gitleaks /usr/local/bin/
          gitleaks version

      # Runs after Trivy on purpose (see the job-level note above): `dir .` scans
      # the whole workspace, including .cache/trivy/ and the trivy-*.json
      # reports the previous steps just created. Both are allowlisted in
      # .gitleaks.toml — if this step is ever reordered before Trivy, or Trivy
      # starts writing to a new path, revisit that allowlist.
      - name: Run Gitleaks scan
        run: |
          gitleaks dir . \
            --config .github/workflows/.gitleaks.toml \
            --gitleaks-ignore-path .github/workflows/.gitleaksignore \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0 \
            --verbose

      - name: Publish Gitleaks summary
        id: gitleaks-summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Gitleaks Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f gitleaks-report.json ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
            echo "gitleaks_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(grep -o '"RuleID"' gitleaks-report.json | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **${COUNT} secret(s) detected in the working tree!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule | File |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          with open('gitleaks-report.json') as f:
            data = json.load(f)
          if isinstance(data, list):
            for item in data[:20]:
              rule = item.get('RuleID', 'N/A')
              file = item.get('File', 'N/A')
              print(f'| {rule} | {file} |')
          " >> $GITHUB_STEP_SUMMARY
          fi

          echo "gitleaks_findings=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14

      - name: Enforce security gate
        if: always()
        run: |
          TRIVY_FINDINGS="${{ steps.trivy-summary.outputs.trivy_findings }}"
          GITLEAKS_FINDINGS="${{ steps.gitleaks-summary.outputs.gitleaks_findings }}"

          if [ "${TRIVY_FINDINGS:-0}" -gt 0 ] || [ "${GITLEAKS_FINDINGS:-0}" -gt 0 ]; then
            echo "::error::Security gate failed — ${TRIVY_FINDINGS:-0} Trivy CRITICAL/HIGH finding(s), ${GITLEAKS_FINDINGS:-0} Gitleaks secret(s). See the job summary for details."
            exit 1
          fi

          echo "Security gate passed."