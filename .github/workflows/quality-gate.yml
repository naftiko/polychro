name: Quality Gate

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build & Test Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build and verify
        # polychro-capability and polychro-cli require io.ikanos:ikanos-engine and
        # io.ikanos:ikanos-spec from GitHub Packages.
        # setup-java injects credentials via server-id: github-naftiko (matches pom.xml repo id).
        run: mvn -B clean verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  test-go:
    name: Test Go
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: modules/polychro-go/go.mod

      - name: Run tests
        working-directory: modules/polychro-go
        run: go test ./...

  test-node:
    name: Test Node
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modules/polychro-node/package-lock.json

      - name: Install dependencies
        working-directory: modules/polychro-node
        run: npm ci

      - name: Run tests
        working-directory: modules/polychro-node
        run: npm test

  test-python:
    name: Test Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install package and test dependencies
        working-directory: modules/polychro-python
        run: pip install . pytest

      - name: Run tests
        working-directory: modules/polychro-python
        run: pytest

  security-scan:
    name: Dependency & Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Init summary
        run: |
          echo "# Security Scan Report — $(date '+%Y-%m-%d %H:%M') UTC" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Gitleaks | Secrets in the current working tree |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY

      - name: Install Gitleaks
        run: |
          mkdir -p /tmp/gitleaks-install
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -O /tmp/gitleaks-install/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks-install/gitleaks.tar.gz -C /tmp/gitleaks-install
          chmod +x /tmp/gitleaks-install/gitleaks
          sudo mv /tmp/gitleaks-install/gitleaks /usr/local/bin/
          gitleaks version

      # This job scans secrets only — dependency/CVE scanning (Trivy) stays
      # nightly-only (see naftiko/polychro#150 / #160 discussion: the PR gate
      # was scoped down to secrets, since a CVE gate can start failing on an
      # unrelated PR the moment a new advisory is published against an
      # already-merged dependency, which is not something that PR's author
      # can be expected to fix). `dir .` scans the working tree only, not the
      # full git history — this is a PR gate, not a forensic scan.
      - name: Run Gitleaks scan
        run: |
          gitleaks dir . \
            --config .github/workflows/.gitleaks.toml \
            --gitleaks-ignore-path .github/workflows/.gitleaksignore \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0 \
            --verbose

      - name: Publish Gitleaks summary
        id: gitleaks-summary
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Gitleaks Secret Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f gitleaks-report.json ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
            echo "gitleaks_findings=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(grep -o '"RuleID"' gitleaks-report.json | wc -l | tr -d ' ')

          if [ "$COUNT" -eq 0 ]; then
            echo "✅ No secrets detected." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **${COUNT} secret(s) detected in the working tree!**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Rule | File |" >> $GITHUB_STEP_SUMMARY
            echo "|------|------|" >> $GITHUB_STEP_SUMMARY
            python3 -c "
          import json
          with open('gitleaks-report.json') as f:
            data = json.load(f)
          if isinstance(data, list):
            for item in data[:20]:
              rule = item.get('RuleID', 'N/A')
              file = item.get('File', 'N/A')
              print(f'| {rule} | {file} |')
          " >> $GITHUB_STEP_SUMMARY
          fi

          echo "gitleaks_findings=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Upload Gitleaks report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 14

      - name: Enforce security gate
        if: always()
        run: |
          GITLEAKS_FINDINGS="${{ steps.gitleaks-summary.outputs.gitleaks_findings }}"

          if [ "${GITLEAKS_FINDINGS:-0}" -gt 0 ]; then
            echo "::error::Security gate failed — ${GITLEAKS_FINDINGS:-0} Gitleaks secret(s). See the job summary for details."
            exit 1
          fi

          echo "Security gate passed."