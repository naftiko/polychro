name: Publish Maven to Sonatype and GitHub Packages

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  scan-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github-naftiko
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Resolve dependencies
        # Populates the local .m2 repo so the SBOM reflects actual resolved
        # transitive versions, not just what's declared in pom.xml.
        run: mvn -B dependency:go-offline
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (CycloneDX)
        # Scanning the resolved SBOM instead of raw fs avoids Trivy's static
        # pom.xml parser, which silently fails to resolve versions declared
        # via BOM imports or properties
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.2:makeAggregateBom -DoutputFormat=json -DoutputName=bom

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target/bom.json

      - name: Scan SBOM for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "sbom"
          scan-ref: "target/bom.json"
          format: "json"
          output: "trivy-sbom-results.json"
          severity: "MEDIUM,HIGH,CRITICAL"
          exit-code: "0"

      - name: Publish Trivy summary
        if: always()
        run: |
          echo "## Trivy SBOM Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ ! -f trivy-sbom-results.json ]; then
            echo "> No report found." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-sbom-results.json)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-sbom-results.json)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-sbom-results.json)

          [ "$CRITICAL" -gt 0 ] && STATUS="❌ ${CRITICAL} critical issue(s) — blocking publish" \
            || { [ "$HIGH" -gt 0 ] && STATUS="❌ ${HIGH} high issue(s) — blocking publish" || STATUS="✅ No critical or high issues"; }

          echo "**${STATUS}**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| High     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
          echo "| Medium   | ${MEDIUM} |" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "<details><summary>Critical/High vulnerability findings</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Package | Vulnerability ID | Severity | Installed | Fixed |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-------------------|----------|-----------|-------|" >> $GITHUB_STEP_SUMMARY
            jq -r '
              [.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH")]
              | sort_by(if .Severity=="CRITICAL" then 0 else 1 end)
              | .[]
              | "| \(.PkgName) | \(.VulnerabilityID) | \(.Severity) | \(.InstalledVersion) | \(if (.FixedVersion // "") == "" then "n/a" else .FixedVersion end) |"
            ' trivy-sbom-results.json >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

          # Enforces the actual gate here, since exit-code is disabled on the Trivy step above
          if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
            exit 1
          fi

      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sbom-report
          path: trivy-sbom-results.json

  github-snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name != 'workflow_dispatch'
    needs: scan-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven
        run: bash ./scripts/builder.sh config_maven_github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        run: echo "VERSION=$(mvn -q -Dexec.executable=echo -Dexec.args='${project.version}' --non-recursive exec:exec)" >> $GITHUB_ENV

      - name: Publish snapshot
        if: contains(env.VERSION, 'SNAPSHOT')
        run: mvn --batch-mode -Dgpg.skip=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  maven-central:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: scan-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Download SBOM
        # Reuses the exact SBOM scan-dependencies generated and Trivy already
        uses: actions/download-artifact@v4
        with:
          name: sbom-cyclonedx
          path: target

      - name: Configure Maven Central
        run: bash ./scripts/builder.sh config_maven_central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GPG
        run: bash ./scripts/builder.sh config_gpg
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish to Maven Central
        run: bash ./scripts/builder.sh central
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #- name: Test deploy (local repo)
      #  run: bash ./scripts/builder.sh deploy_local_repo

      #- name: List repo content
      #  run: find local-repo -type f
      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: target/bom.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: |
          rm -rf ~/.gnupg
          rm -f ~/.m2/settings.xml

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: scan-dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven
        run: bash ./scripts/builder.sh config_maven_github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Packages (release)
        run: mvn --batch-mode -Dgpg.skip=true deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}